    .dg-s-primary{stroke:var(--wp--preset--color--primary,#053338)}
    .dg-s-alt{stroke:var(--wp--preset--color--primary-alt,#DAFF8C)}
    .dg-s-line{stroke:var(--wp--preset--color--border-light,#DFE8E5)}
    .dg-s-dark{stroke:var(--wp--preset--color--border-dark,#BCCBC6)}
    .dg-s-base{stroke:var(--wp--preset--color--base,#FFFFFF)}
    .dg-text{font-family:var(--wp--preset--font-family--primary,Arial),Arial,sans-serif;font-weight:600}
    .dg-label{font-family:var(--wp--preset--font-family--primary,Arial),Arial,sans-serif;font-weight:600;letter-spacing:.08em}
  </style>

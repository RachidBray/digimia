  <!-- Store cards: best sellers this week, downloads per day, and a new sale. Sand and coral are fixed artwork colors. Palette colors are CSS custom properties with the default palette as fallback; inc/blocks.php inlines this file so it follows the active palette and dark mode. -->
  <style>
    .dg-primary{fill:var(--wp--preset--color--primary,#053338)}
    .dg-alt{fill:var(--wp--preset--color--primary-alt,#DAFF8C)}
